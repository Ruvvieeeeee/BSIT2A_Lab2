<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .register-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .register-container h1 {
      text-align: center;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 5px 0 20px;
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }

    .terms input {
      margin-top: 3px;
      accent-color: #667eea;
    }

    .terms a,
    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }

    .terms a:hover,
    .login-link a:hover {
      text-decoration: underline;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(102, 126, 234, 0.35);
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #777;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="register-container">
    <h1>Create Account</h1>
    <p class="subtitle">Sign up to get started</p>

    <form>
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          name="fullname"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Choose a username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Confirm your password"
          required
        >
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          I agree to the
          <a href="#">Terms & Conditions</a>
        </label>
      </div>

      <button type="submit" class="register-btn">
        Create Account
      </button>
    </form>

    <p class="login-link">
      Already have an account?
      <a href="#">Log in</a>
    </p>
  </div>

</body>
</html>
